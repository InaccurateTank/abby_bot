[package]
name = "abby_bot"
authors = ["inaccuratetank"]
description = "A poorly assembled custom chatbot"
repository = "https://git.inaccuratetank.gay/inaccuratetank/abby_bot"
version = "0.4.0"
edition = "2021"

[dependencies]
poise = { version = "0.6" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal"] }
regex = { version = "1.11" }
time = { version = "0.3", features = ["formatting", "local-offset"] }
gumdrop = { version = "0.8" }
sqlx = { version = "0.8", features = [ "runtime-tokio-native-tls", "sqlite" ] }
serde = { version = "1.0" }
toml = { version = "0.8" }

[dev-dependencies]
brunch = "0.8"

[[bench]]
name = "concat"
harness = false
